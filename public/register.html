<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XPLODE - Create Account</title>
    <meta name="description" content="Create your XPLODE account. Watch unlimited cartoons, earn squad rewards, and grow with us." />
    <link rel="icon" type="image/png" sizes="84x84" href="xlogo-thumb.png" />
    <link rel="apple-touch-icon" href="xlogo-thumb.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body class="app-body app-body-home">
    <div class="page-shell login-page">
      <div class="floating-ornament ornament-left-top" aria-hidden="true">★</div>
      <div class="floating-ornament ornament-right-top" aria-hidden="true">★</div>

      <main class="auth-shell auth-shell-register">
        <div class="auth-card auth-card-register">
          <img class="brand-logo brand-logo-register" src="xlogo.png" alt="XPlode" width="448" height="448" />

          <div class="intro">
            <div class="small-tag">🎬 Join the fun</div>
            <h2>Create Your XPLODE Account</h2>
            <p>🍿 Watch unlimited cartoons — all in one place!</p>
          </div>

          <form id="registerForm" class="auth-form auth-form-register" novalidate>
            <div class="field-row">
              <div class="field-icon icon-user" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2.3-8 5v1h16v-1c0-2.7-3.6-5-8-5Z"/></svg>
              </div>
              <input id="regUsername" name="regUsername" type="text" placeholder="Username (3-24 letters or numbers)" autocomplete="username" minlength="3" maxlength="24" required />
            </div>

            <div class="field-row">
              <div class="field-icon icon-email" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M3 6.8A2.8 2.8 0 0 1 5.8 4h12.4A2.8 2.8 0 0 1 21 6.8v10.4A2.8 2.8 0 0 1 18.2 20H5.8A2.8 2.8 0 0 1 3 17.2Zm2.2-.3 6.8 5.3 6.8-5.3H5.2Z"/></svg>
              </div>
              <input id="email" name="email" type="email" placeholder="Email address" autocomplete="email" required />
            </div>

            <div class="field-row">
              <div class="field-icon icon-phone" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm5 18h.01v.01H12V20Zm-3.5-2h7v-12h-7Z"/></svg>
              </div>
              <input id="mobile" name="mobile" type="tel" placeholder="Mobile money number, e.g. 0770123456" autocomplete="tel" required />
            </div>

            <div class="field-row invite-row">
              <div class="field-icon icon-lock" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-5 6.2A1.8 1.8 0 1 1 13.8 13 1.8 1.8 0 0 1 12 15.2Zm2.5-6.2h-5V7a2.5 2.5 0 0 1 5 0Z"/></svg>
              </div>
              <input id="inviteCode" name="inviteCode" type="text" placeholder="Referral code (optional)" autocomplete="off" aria-label="Referral code (optional)" />
            </div>

            <div class="field-row password-row">
              <div class="field-icon icon-lock" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-5 6.2A1.8 1.8 0 1 1 13.8 13 1.8 1.8 0 0 1 12 15.2Zm2.5-6.2h-5V7a2.5 2.5 0 0 1 5 0Z"/></svg>
              </div>
              <input id="regPassword" name="regPassword" type="password" placeholder="Create a strong password (8+ characters)" autocomplete="new-password" minlength="8" required />
              <button class="toggle-password" type="button" data-target="regPassword" aria-label="Show password">
                <svg viewBox="0 0 24 24"><path d="M12 5c5.2 0 9.7 3.5 11 7-1.3 3.5-5.8 7-11 7S2.3 15.5 1 12c1.3-3.5 5.8-7 11-7Zm0 2a8.7 8.7 0 0 0-8.2 5A8.7 8.7 0 0 0 12 17a8.7 8.7 0 0 0 8.2-5A8.7 8.7 0 0 0 12 7Zm0 2.3A2.7 2.7 0 1 1 9.3 12 2.7 2.7 0 0 1 12 9.3Z"/></svg>
              </button>
            </div>

            <div class="field-row password-row">
              <div class="field-icon icon-lock" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-5 6.2A1.8 1.8 0 1 1 13.8 13 1.8 1.8 0 0 1 12 15.2Zm2.5-6.2h-5V7a2.5 2.5 0 0 1 5 0Z"/></svg>
              </div>
              <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required />
              <button class="toggle-password" type="button" data-target="confirmPassword" aria-label="Show password">
                <svg viewBox="0 0 24 24"><path d="M12 5c5.2 0 9.7 3.5 11 7-1.3 3.5-5.8 7-11 7S2.3 15.5 1 12c1.3-3.5 5.8-7 11-7Zm0 2a8.7 8.7 0 0 0-8.2 5A8.7 8.7 0 0 0 12 17a8.7 8.7 0 0 0 8.2-5A8.7 8.7 0 0 0 12 7Zm0 2.3A2.7 2.7 0 1 1 9.3 12 2.7 2.7 0 0 1 12 9.3Z"/></svg>
              </button>
            </div>

            <div class="field-row password-row">
              <div class="field-icon icon-wallet" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h9.3A2.2 2.2 0 0 1 18 7.2V9h2.2A2.8 2.8 0 0 1 23 11.8v6.7A2.5 2.5 0 0 1 20.5 21H6.5A2.5 2.5 0 0 1 4 18.5Zm14 1.5h3.2a1.3 1.3 0 0 1 1.3 1.3v6.7a1.3 1.3 0 0 1-1.3 1.3H18ZM6.5 7h9.4a1 1 0 0 1 1 1v1H6.5A1.5 1.5 0 0 1 5 7.5 1.5 1.5 0 0 1 6.5 6Z"/></svg>
              </div>
              <input id="pin" name="pin" type="password" placeholder="5-digit withdrawal PIN" autocomplete="off" inputmode="numeric" pattern="[0-9]{5}" minlength="5" maxlength="5" required />
              <button class="toggle-password" type="button" data-target="pin" aria-label="Show PIN">
                <svg viewBox="0 0 24 24"><path d="M12 5c5.2 0 9.7 3.5 11 7-1.3 3.5-5.8 7-11 7S2.3 15.5 1 12c1.3-3.5 5.8-7 11-7Zm0 2a8.7 8.7 0 0 0-8.2 5A8.7 8.7 0 0 0 12 17a8.7 8.7 0 0 0 8.2-5A8.7 8.7 0 0 0 12 7Zm0 2.3A2.7 2.7 0 1 1 9.3 12 2.7 2.7 0 0 1 12 9.3Z"/></svg>
              </button>
            </div>

            <p class="helper-copy helper-copy-last">This PIN will be used for withdrawals.</p>

            <button class="submit-btn" type="submit">
              <span>Create Account</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
            </button>

            <p class="signup-text">
              Already have an account?
              <a href="index.html">Sign in</a>
            </p>

            <p class="privacy-copy">🔒 Your information stays private with XPLODE.</p>
            <p id="registerMessage" class="form-message" aria-live="polite"></p>
          </form>
        </div>
      </main>
    </div>

    <script src="xp-config.js?v=1"></script>
    <script src="script.js?v=15" defer></script>
  </body>
</html>
