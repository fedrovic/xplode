<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XPLODE - Sign In</title>
    <meta name="description" content="Sign in to your XPLODE account to watch cartoons, manage your wallet, and grow your squad." />
    <link rel="icon" type="image/png" sizes="84x84" href="xlogo-thumb.png" />
    <link rel="apple-touch-icon" href="xlogo-thumb.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body>
    <div class="page-shell login-page">
      <div class="floating-ornament ornament-left-top" aria-hidden="true">★</div>
      <div class="floating-ornament ornament-left-mid" aria-hidden="true">✦</div>
      <div class="floating-ornament ornament-right-top" aria-hidden="true">★</div>
      <div class="floating-ornament ornament-right-mid" aria-hidden="true">✦</div>
      <div class="floating-ornament ornament-bottom" aria-hidden="true">✦</div>

      <main class="auth-shell">
        <div class="auth-card auth-card-login">
          <img class="brand-logo" src="xlogo.png" alt="XPlode" width="448" height="448" />

          <form id="loginForm" class="auth-form" novalidate>
            <div class="field-row">
              <div class="field-icon icon-user" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4.4 0-8 2.3-8 5v1h16v-1c0-2.7-3.6-5-8-5Z"/></svg>
              </div>
              <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required />
            </div>

            <div class="field-row password-row">
              <div class="field-icon icon-lock" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-5 6.2A1.8 1.8 0 1 1 13.8 13 1.8 1.8 0 0 1 12 15.2Zm2.5-6.2h-5V7a2.5 2.5 0 0 1 5 0Z"/></svg>
              </div>
              <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
              <button class="toggle-password" type="button" data-target="password" aria-label="Toggle password visibility">
                <svg viewBox="0 0 24 24"><path d="M12 5c5.2 0 9.7 3.5 11 7-1.3 3.5-5.8 7-11 7S2.3 15.5 1 12c1.3-3.5 5.8-7 11-7Zm0 2a8.7 8.7 0 0 0-8.2 5A8.7 8.7 0 0 0 12 17a8.7 8.7 0 0 0 8.2-5A8.7 8.7 0 0 0 12 7Zm0 2.3A2.7 2.7 0 1 1 9.3 12 2.7 2.7 0 0 1 12 9.3Z"/></svg>
              </button>
            </div>

            <button class="submit-btn" type="submit">
              <span>Sign in</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" /></svg>
            </button>

            <p class="signup-text">
              New here?
              <a href="register.html">Create an account</a>
            </p>

            <p id="formMessage" class="form-message" aria-live="polite"></p>
          </form>
        </div>
      </main>
    </div>

    <script src="xp-config.js?v=1"></script>
    <script src="script.js?v=15" defer></script>
  </body>
</html>
