<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XPLODE - Team</title>
    <meta name="description" content="Grow your XPLODE squad: share your invite code and track your referral levels." />
    <link rel="icon" type="image/png" sizes="84x84" href="xlogo-thumb.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body class="app-body app-body-home account-page team-account-page">
    <div class="app-shell app-shell-home account-shell">
      <div class="home-layout account-layout">
        <header class="xplode-banner dashboard-header account-header">
          <div class="banner-topline">
            <img class="mini-mark" src="xlogo-thumb.png" alt="XPlode" width="84" height="84" />
          </div>
          <div class="balance-box">
            <span class="balance-pill-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H19a2 2 0 0 1 2 2v11H5a2 2 0 0 1-2-2V7.5Z"/><path d="M3 9h16a2 2 0 0 1 2 2v2h-5a2 2 0 0 1 0-4h5"/><path d="M16.5 11.1v.8"/></svg></span>
            <span class="balance-label">WITHDRAWABLE</span>
            <strong data-balance="withdrawable">UGX 0</strong>
          </div>
        </header>

        <main class="account-main team-main">
          <section class="team-invite-panel" aria-labelledby="teamInviteHeading">
            <span class="team-panel-icon" aria-hidden="true">♙</span>
            <div class="team-invite-copy">
              <span id="teamInviteHeading">YOUR INVITE CODE</span>
              <strong id="teamInviteCode">······</strong>
              <button type="button" class="team-copy-code" id="copyTeamInviteCode">▢ Copy</button>
              <div class="team-invite-link-row">
                <span id="teamInviteLink">Loading invitation link…</span>
                <button type="button" id="copyTeamInviteLink">Copy</button>
              </div>
              <button type="button" class="team-share-button" id="shareTeamInvite">Share Invite Link</button>
            </div>
          </section>

          <section class="team-level-grid" aria-label="Referral levels">
            <div><strong>0</strong><span>Direct</span></div>
            <div><strong>0</strong><span>Level 2</span></div>
            <div><strong>0</strong><span>Total</span></div>
          </section>

          <section class="my-team-panel">
            <h1 id="myTeamHeading">My Team (0)</h1>
            <p>Share your invitation link to grow your squad. Counts update automatically as friends join with your code.</p>
          </section>
        </main>

        <a class="account-support" href="https://t.me/jenny_sabierl" target="_blank" rel="noopener noreferrer" aria-label="Chat with XPlode support on Telegram" title="Chat with XPlode Support">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><path d="M4 12h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4a1 1 0 0 1 1-1Zm16 0h-2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-4a1 1 0 0 0-1-1Z"/></svg>
        </a>

        <nav class="dashboard-mini-nav account-bottom-nav" aria-label="Primary navigation">
          <a class="dashboard-card" href="dashboard.html"><span class="home-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-9.5Z"/></svg></span><span>HOME</span></a>
          <a class="dashboard-card" href="cartoons.html"><span class="home-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 8h5v11H7"/><path d="m10 9 6 3-6 3V9Z"/></svg></span><span>TOONHUB</span></a>
          <a class="dashboard-card active" href="team.html" aria-current="page"><span class="home-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm-6 9a6 6 0 0 1 12 0M18 7a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm3 11a4.5 4.5 0 0 0-3-4.2"/></svg></span><span>TEAM</span></a>
          <a class="dashboard-card" href="my.html"><span class="home-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg></span><span>MY</span></a>
        </nav>
      </div>
    </div>

    <script src="xp-config.js?v=1"></script>
    <script src="script.js?v=15" defer></script>
  </body>
</html>
